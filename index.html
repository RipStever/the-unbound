<title>The Unbound</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one fixed 1280x640 stage scaled to fit; HUD and panels are HTML over the canvas. Single dusk-neon look by design. */
:root{
  --bg:#0b0716; --ink:#f3eefe; --dim:#a99ec4; --glass:rgba(18,10,34,.86); --line:#5ef2ff;
  --amber:#ffb347; --mag:#ff4f9a; --hot:#ff5a4e;
  --display:'Chakra Petch','Bahnschrift','Segoe UI',system-ui,sans-serif;
  --body:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html{height:100%;box-sizing:border-box}
body{height:100%;margin:0;box-sizing:border-box;background:var(--bg);color:var(--ink);font-family:var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;
  overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;width:100%;height:100%;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:640px;transform:translate(-50%,-50%);transform-origin:center;overflow:hidden;box-shadow:0 0 0 1px rgba(94,242,255,.18),0 18px 50px rgba(0,0,0,.6)}
#c{position:absolute;left:0;top:0;width:1280px;height:640px;display:block;touch-action:none;cursor:crosshair}
.hud{position:absolute;pointer-events:none;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
#trip{left:50%;top:18px;transform:translateX(-50%);width:520px;display:grid;gap:6px;font-size:13px;color:var(--dim)}
#trip .row{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums}
#trip .row b{color:var(--ink)}
#trip .track{position:relative;height:6px;background:rgba(255,255,255,.1)}
#trip .done{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,var(--line),var(--mag))}
#trip .done.gold{background:linear-gradient(90deg,#ffb347,#fff2c4)}
#trip .rift{position:absolute;right:-7px;top:-5px;width:12px;height:16px;border:2px solid var(--mag);border-radius:50%;box-shadow:0 0 10px var(--mag)}
#chron{right:28px;top:20px;display:flex;align-items:center;gap:10px;font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
#chron svg{width:20px;height:26px}
#mute{position:absolute;right:28px;top:62px;font-family:var(--display);font-weight:700;font-size:12px;letter-spacing:.1em;background:rgba(255,255,255,.06);color:var(--dim);border:1px solid rgba(94,242,255,.25);padding:5px 10px;cursor:pointer}
.panel{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:560px;background:var(--glass);border:1px solid rgba(94,242,255,.35);
  clip-path:polygon(0 0,calc(100% - 22px) 0,100% 22px,100% 100%,22px 100%,0 calc(100% - 22px));padding:26px 30px 28px;box-sizing:border-box;backdrop-filter:blur(3px)}
.eyebrow{margin:0;font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--line)}
.panel h1,.panel h2{margin:4px 0 6px;font-size:44px;line-height:1;font-weight:700;letter-spacing:.02em;text-wrap:balance}
.sub{margin:0 0 20px;font-family:var(--body);font-size:15px;line-height:1.45;color:var(--dim)}
.ups{display:grid;gap:10px;margin-bottom:22px}
.up{display:grid;grid-template-columns:44px 1fr auto;gap:14px;align-items:center;padding:10px 12px;background:rgba(255,255,255,.04);border-left:2px solid var(--line)}
.up .ico{width:44px;height:44px;display:grid;place-items:center;background:rgba(94,242,255,.08)}
.up .ico svg{width:28px;height:28px}
.up .txt{min-width:0;display:grid;gap:3px}
.up .txt b{font-size:16px;letter-spacing:.04em}
.up .val{font-family:var(--body);font-size:13px;color:var(--dim)}
.up .val em{font-style:normal;color:var(--amber)}
.ticks{display:flex;gap:4px;margin-top:3px}
.ticks i{width:12px;height:4px;background:rgba(255,255,255,.14)}
.ticks i.on{background:var(--line);box-shadow:0 0 6px rgba(94,242,255,.6)}
.buy{min-width:96px;font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.06em;color:var(--bg);background:var(--amber);border:0;padding:9px 12px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;
  clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.buy svg{width:11px;height:15px}
.buy:disabled{background:rgba(255,255,255,.12);color:var(--dim);cursor:not-allowed}
.buy:not(:disabled):hover{filter:brightness(1.1)}
.go{width:100%;font-family:var(--display);font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--bg);background:linear-gradient(90deg,var(--line),#b4f7ff);border:0;padding:14px;cursor:pointer;
  clip-path:polygon(14px 0,100% 0,calc(100% - 14px) 100%,0 100%)}
.go:hover{filter:brightness(1.08)}
.rows{display:grid;gap:8px;margin:6px 0 22px;font-family:var(--body);font-size:15px}
.rows div{display:flex;justify-content:space-between;color:var(--dim);border-bottom:1px solid rgba(255,255,255,.06);padding-bottom:6px}
.rows b{color:var(--amber);font-variant-numeric:tabular-nums}
.rows p{margin:0;color:var(--dim);line-height:1.5}
.link{display:block;margin:14px auto 0;background:none;border:0;color:var(--dim);font-family:var(--body);font-size:13px;text-decoration:underline;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.anc-hud{display:flex;align-items:center;gap:8px;margin-left:10px}
.anc-hud svg{width:18px;height:20px}
.loadout{width:720px;padding:20px 28px}
.loadout .go{padding:12px}
.lh{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;margin-bottom:10px}
.lh h1{margin-bottom:0}
.lh .sub{margin:0;max-width:280px;text-align:right;font-size:13px}
.seg{display:flex;gap:4px;border-bottom:1px solid rgba(255,255,255,.1);margin-bottom:14px}
.seg button{position:relative;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;color:rgba(255,79,154,.6);font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:8px 11px 9px;cursor:pointer}
.seg button:hover{color:rgba(255,79,154,.85)}
.seg button[aria-selected="true"]{color:var(--mag);border-bottom-color:var(--mag)}
.seg .dot{position:absolute;top:7px;right:5px;width:6px;height:6px;border-radius:50%;background:var(--line)}
.pane{min-height:300px;max-height:356px;overflow-y:auto;overscroll-behavior:contain;display:grid;align-content:start;gap:6px;margin-bottom:14px;padding-right:4px;
  scrollbar-width:thin;scrollbar-color:rgba(94,242,255,.35) transparent}
.lbl{margin:8px 0 2px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim)}
.lbl:first-child{margin-top:0}
.loadout .up{grid-template-columns:32px 1fr 104px;gap:14px;padding:6px 12px;background:rgba(255,255,255,.035);border-left:0}
.loadout .up .ico{width:32px;height:32px;background:none}
.loadout .up .ico svg{width:24px;height:24px}
.loadout .up .txt b{font-size:15px}
.loadout .buy{width:104px;min-width:0}
.buy.anc{background:var(--mag);color:var(--ink)}
.buy.anc:disabled{background:rgba(255,255,255,.12);color:var(--dim)}
.buy.ghost{background:none;color:var(--dim);box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.guns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.gcard{display:grid;grid-template-rows:auto auto 1fr auto;gap:8px;padding:16px;background:rgba(255,255,255,.035);border:1px solid transparent;min-width:0}
.gcard.eq{border-color:rgba(94,242,255,.4)}
.gcard>svg{width:84px;height:30px}
.gcard b{font-size:18px;letter-spacing:.03em}
.gcard p{margin:0;font-family:var(--body);font-size:13px;line-height:1.45;color:var(--dim)}
.gcard .stats{font-family:var(--body);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.gcard .buy{width:100%}
.rows .ancrow b{color:var(--mag)}
#bossbar{left:50%;top:64px;transform:translateX(-50%);width:420px;display:grid;gap:4px;font-size:12px;letter-spacing:.2em;color:#ffb347;text-align:center}
#bossbar .bb{height:7px;background:rgba(255,255,255,.1);clip-path:polygon(0 0,100% 0,98% 100%,2% 100%)}
#bossbar .bbf{height:100%;width:100%;background:linear-gradient(90deg,#ffb347,#ff4f9a)}
.tip{display:flex;align-items:center;gap:14px;margin:0 0 12px;padding:10px 12px;background:rgba(255,179,71,.1);border:1px solid rgba(255,179,71,.45);border-left:3px solid var(--amber)}
.tip p{margin:0;flex:1;min-width:0;font-family:var(--body);font-size:13px;line-height:1.45;color:var(--ink)}
.tip p b{color:var(--amber);margin-right:4px}
.tipbtns{display:flex;flex-direction:column;align-items:center;gap:2px}
.tipbtns .buy{width:auto;padding:7px 14px}
.tipbtns .link{margin:2px 0 0}
.loadout.tipping .pane{max-height:290px;min-height:240px}
.rows .pxrow b{color:#ff5a5a}
.px-hud{display:flex;align-items:center;gap:8px;margin-left:10px}
.px-hud svg{width:18px;height:18px}
.buy.red{background:#ff5a5a;color:var(--ink)}
.buy.red:disabled{background:rgba(255,255,255,.12);color:var(--dim)}
.reset{display:grid;grid-template-columns:1fr 132px;gap:14px;align-items:center;padding:10px 12px;margin-bottom:4px;background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.35)}
.reset b{display:block;font-size:15px;margin-bottom:2px}
.reset span{font-family:var(--body);font-size:12.5px;line-height:1.4;color:var(--dim)}
.reset .buy{width:132px}
.reset .buy.armed{background:#fff;color:#b3122a}
.carry{margin-left:6px;font-size:12px;font-weight:500;color:var(--line);font-variant-numeric:tabular-nums}
.note{margin:6px 0 0;font-family:var(--body);font-size:12px;color:var(--dim)}
#cbar{position:absolute;left:24px;bottom:18px;display:flex;gap:8px}
.cb{position:relative;width:62px;height:58px;display:grid;place-items:center;background:rgba(18,10,34,.72);border:1px solid rgba(94,242,255,.35);color:var(--ink);cursor:pointer;padding:0;
  clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,0 100%)}
.cb svg{width:26px;height:26px}
.cb .n{position:absolute;right:6px;bottom:4px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.cb .k{position:absolute;left:6px;top:3px;font-size:10px;color:var(--dim)}
.cb:disabled{opacity:.35;cursor:default}
.cb:not(:disabled):hover{background:rgba(94,242,255,.12)}
#dodge{position:absolute;left:28px;top:50%;transform:translateY(-50%);width:92px;height:92px;border-radius:50%;padding:0;cursor:pointer;
  display:grid;place-items:center;color:rgba(230,253,255,.85);background:rgba(255,255,255,.07);border:1.5px solid rgba(230,253,255,.3);
  --p:1;background-image:conic-gradient(rgba(94,242,255,.22) calc(var(--p)*360deg),transparent 0)}
#dodge svg{width:40px;height:40px;grid-area:1/1}
#dodge b{grid-area:1/1;font-size:26px;font-variant-numeric:tabular-nums;color:var(--ink)}
#spearPips{left:28px;top:calc(50% + 56px);width:92px;display:flex;justify-content:center;gap:5px;align-items:center;font-size:10px;letter-spacing:.12em;color:var(--dim)}
#spearPips i{width:14px;height:5px;background:rgba(255,179,71,.18);position:relative;overflow:hidden}
#spearPips i.on{background:#ffb347}
#spearPips i b{position:absolute;left:0;top:0;bottom:0;background:rgba(255,179,71,.6)}
#dodge.cool{cursor:default}
#dodge.cool svg{opacity:.18}
#dodge:not(.cool):hover{background-color:rgba(94,242,255,.12)}
.autochip{align-self:flex-end;display:grid;gap:2px;padding:6px 10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--line);background:rgba(18,10,34,.72);border:1px dashed rgba(94,242,255,.45)}
.autochip small{font-size:10px;color:var(--dim)}
.autochip.used{opacity:.4}
.cfg{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:6px;font-family:var(--body);font-size:13px;color:var(--dim)}
.cfg select{font-family:var(--body);font-size:13px;color:var(--ink);background:#1a1030;border:1px solid rgba(94,242,255,.4);padding:4px 6px;max-width:100%}
.cfg select:focus-visible{outline:2px solid var(--line);outline-offset:1px}
</style>

<div id="wrap">
  <div id="stage">
    <canvas id="c" width="1280" height="640"></canvas>

    <div id="trip" class="hud">
      <div class="row"><span id="tripL">Rift 1</span><span><b id="tripM">0 days</b><span id="tripS"> to the rift</span></span></div>
      <div class="track"><div class="done"></div><div class="rift"></div></div>
    </div>
    <div id="chron" class="hud"><svg viewBox="0 0 20 26" aria-hidden="true"><path d="M10 1 19 13 10 25 1 13Z" fill="#ffb347" stroke="#fff2c4" stroke-width="1.2"/><path d="M10 1v24M1 13h18" stroke="#0b0716" stroke-opacity=".35"/></svg><b id="chronN">0</b><span class="anc-hud"><svg viewBox="0 0 14 15" aria-hidden="true"><path d="M7 .5 13.5 4.2v6.6L7 14.5.5 10.8V4.2Z" fill="#ff4f9a" stroke="#ffd1e6" stroke-width="1"/></svg><b id="ancN">0</b></span><span class="px-hud" id="pxHud" hidden><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1 15 8 8 15 1 8Z" fill="#ff5a5a" stroke="#ffd0d0" stroke-width="1"/><path d="M8 4v8" stroke="#3a0d14" stroke-width="1.6"/></svg><b id="pxN">0</b></span></div>
    <button id="mute" type="button">Sound on</button>
    <div id="cbar" hidden></div>
    <div id="bossbar" class="hud" hidden><span>The Hollow Hour</span><div class="bb"><div class="bbf"></div></div></div>
    <button id="dodge" type="button" hidden aria-label="Rewind step (Space)"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M21 10 11 20l10 10M31 10 21 20l10 10" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg><b id="dodgeN"></b></button>
    <div id="spearPips" class="hud" hidden></div>

    <div id="shop" class="panel loadout" hidden>
      <div class="lh"><div><p class="eyebrow">Loadout</p><h1 id="shopT">Rift 1</h1></div><p id="shopSub" class="sub"></p></div>
      <div id="tip" class="tip" hidden role="status">
        <p><b>Stuck on this rift?</b> Consumables like the Freeze grenade and Barrier can get you through a rough patch. They're used up, but they're cheap.</p>
        <div class="tipbtns"><button type="button" class="buy" data-act="tipgo">Show me</button><button type="button" class="link" data-act="tipx">Got it</button></div>
      </div>
      <div id="seg" class="seg" role="tablist">
        <button type="button" role="tab" data-tab="up">Upgrades</button>
        <button type="button" role="tab" data-tab="gun">Weapons</button>
        <button type="button" role="tab" data-tab="gear">Gear</button>
        <button type="button" role="tab" data-tab="sync">Sync</button>
        <button type="button" role="tab" data-tab="cons">Consumables</button>
        <button type="button" role="tab" data-tab="px">Paradox</button>
      </div>
      <div id="pane" class="pane" role="tabpanel"></div>
      <button id="go" class="go" type="button">Begin rewind</button>
    </div>

    <div id="msg" class="panel" hidden>
      <p id="msgE" class="eyebrow"></p>
      <h2 id="msgT"></h2>
      <div id="msgB" class="rows"></div>
      <button id="msgGo" class="go" type="button"></button>
      <button id="msgAlt" class="link" type="button" hidden>Start over from rift 1</button>
    </div>
  </div>
</div>

<script>
'use strict';
const W=1280,H=640,DT=1/60,GRAV=1400,PSX=300,S=80,WALK=50,PORTAL=60,TW=2048;
const $=s=>document.querySelector(s);
const wrap=$('#wrap'),stage=$('#stage'),cv=$('#c'),ctx=cv.getContext('2d');
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
let K=1,BK=1;
const clamp=(v,a,b)=>v<a?a:v>b?b:v, rand=(a,b)=>a+Math.random()*(b-a), pick=a=>a[Math.floor(Math.random()*a.length)];
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

// ---------- progression ----------
const FIRE=[.8,.75,.7,.65,.61,.57,.53,.49,.46,.43,.4,.37,.35,.33,.31];
// 15 levels each for power and fire rate; costs climb ~30% per step so the long tail stays reachable
const COST=[8,16,28,44,65,90,120,160,210,280,370,480,620,800];
const SIGHT=[90,160,240,330,430,560,720,900];
const ARCFIRE=[1.05,.98,.92,.86,.8,.75,.7,.65,.61,.57,.53,.5,.47,.44,.41];
const GUNS={
  bolt:{name:'Bolt pistol',unlock:0,col:'#ffb347',blurb:'Single bolts. Headshots crit for 2.5x damage.',ups:{
    power:{name:'Bolt power',vals:[14,17,20,24,28,32,37,42,47,52,58,64,70,77,85],cost:COST,fmt:v=>v+' damage per bolt'},
    rate:{name:'Fire rate',vals:FIRE,cost:COST,fmt:v=>v.toFixed(2)+' s between shots'},
  }},
  arc:{name:'Arc gun',unlock:5,start:3,col:'#5ef2ff',blurb:'Instant lightning that jumps between nearby echoes and stuns everything it hits. No headshot crits.',ups:{
    power:{name:'Arc power',vals:[13,15,18,21,25,29,33,38,42,47,52,57,63,69,75],cost:COST,fmt:v=>v+' damage per strike'},
    rate:{name:'Fire rate',vals:ARCFIRE,cost:COST,fmt:v=>v.toFixed(2)+' s between shots'},
    chain:{name:'Chain',vals:[2,3,4,5,6,7,8,9],cost:[30,80,180,350,600,950,1400],fmt:v=>v+' extra '+(v>1?'echoes':'echo')+' hit per shot'},
  }},
};
const GEN={
  sight:{name:'Sight',vals:SIGHT,cost:[8,20,45,90,160,260,400],fmt:v=>Math.round(v/10)+' m aim line'},
  salvage:{name:'Anomaly Collector',vals:[1,1.3,1.6,2,2.4,2.9,3.5,4.2],cost:[20,50,110,220,400,700,1100],fmt:v=>'x'+v.toFixed(1)+' anomalies per kill'},
};
// one-time items bought with sparks; tab says whether Wren wears it (gear) or Sync runs it (sync)
const KIT={
  shield:{tab:'gear',name:'Phase shield',cost:3,blurb:'Takes one hit per run, then breaks in a stasis burst that freezes everything near you.'},
  spear:{tab:'gear',name:'Spear',cost:4,blurb:'Wren jabs anything that gets close, automatically. Works on charges that refill one at a time.'},
  boots:{tab:'gear',name:'Chrono boots',cost:5,blurb:'You walk back 15% faster, so you reach the rift sooner.'},
  after:{tab:'gear',name:'Afterimage',cost:4,blurb:'Each rewind step leaves a frozen copy of Wren behind. Ground echoes stall at it until they break it or it fades after 6 s.'},
  mount:{tab:'sync',name:'Mounted weapon',cost:6,blurb:'Sync carries a bolt pistol and fires straight ahead on his own, using your Bolt pistol upgrades.'},
  auto:{tab:'sync',name:'Auto-deployer',cost:4,blurb:'Sync uses one of your consumables for you, once per run, when the trigger you pick happens.'},
  capacitor:{tab:'sync',name:'Stasis capacitor',cost:3,blurb:'Every freeze lasts 50% longer: cores, grenades and the shield burst.'},
  crit:{tab:'sync',name:'Crit sight',cost:2,blurb:'Sync marks each echo\'s critical point in amber so headshots are easy to see. Crits only land with the Bolt pistol.'},
};
// levelled items; cur 'a' = anomalies, 's' = sparks. needs = the KIT item that must be owned first
const LV={
  spear:{needs:'spear',name:'Spear charges',vals:[1,2,3,4],cost:[80,200,450],cur:'a',fmt:v=>v+' charge'+(v>1?'s':'')+', 6 s each to refill'},
  after:{needs:'after',name:'Afterimage',vals:[0,1,2],cost:[3,5],cur:'s',fmt:v=>['Blocks ground echoes for 6 s','Also shoots at echoes for 6 s','Shoots, and lasts 9 s'][v],short:v=>['Blocks','Shoots','Lasts 9 s'][v]},
  dodge:{name:'Long rewind',vals:[90,120,150,185,220],cost:[40,90,180,320],cur:'a',fmt:v=>Math.round(v/10)+' days back per rewind step'},
  rift:{name:'Rift breaker',vals:[8,6.8,5.6,4.5,3.5],cost:[2,3,5,8],cur:'s',fmt:v=>v.toFixed(1)+' s for Sync to open a rift'},
};
const lv=k=>LV[k].vals[save.lv[k]];
const TRIG={hold:'Sync starts opening the rift',close:'an echo gets within 8 m',dive:'a wraith starts diving',surge:'a surge starts',half:'you pass halfway',shield:'your shield breaks'};
const frz=()=>save.kit.capacitor?1.5:1;
const CONS={
  grenade:{name:'Freeze grenade',cost:25,key:'1',blurb:'Lob it along your aim. Freezes every echo in the blast for 3 s.'},
  wall:{name:'Barrier',cost:30,key:'2',blurb:'Drops a wall in front of you. Ground echoes stall at it until they break it down.'},
  overclock:{name:'Overclock',cost:20,key:'3',blurb:'Doubles your fire rate for 8 s.'},
  shock:{name:'Shockwave',cost:35,key:'4',blurb:'Shoves every ground echo on screen back and staggers them.'},
  lull:{name:'Lull',cost:30,key:'5',blurb:'For 3 s, everything slows to a crawl and nothing new comes through. Made for holding the line.'},
};
const CONS_MAX=5;
const PERKS={

  px:0,perk:{start:0,memory:0,anchor:0,seed:0,train:0},best:0,cycles:0});
function load(){
  const f=fresh();
  try{const s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.guns&&s.level){
    for(const k in f.guns){s.guns[k]=Object.assign(f.guns[k],s.guns[k]);const st=GUNS[k].start||0;if(s.guns[k].owned){s.guns[k].power=Math.max(s.guns[k].power,st);s.guns[k].rate=Math.max(s.guns[k].rate,st)}}
    s.gen=Object.assign(f.gen,s.gen);s.kit=Object.assign(f.kit,s.kit);s.cons=Object.assign(f.cons,s.cons);s.auto=Object.assign(f.auto,s.auto);s.perk=Object.assign(f.perk,s.perk);s.lv=Object.assign(f.lv,s.lv);if(!s.best)s.best=Math.max(0,(s.level||1)-1);if(!GUNS[s.gun])s.gun='bolt';
    return Object.assign(f,s);
  }}catch(e){}
  try{const o=JSON.parse(localStorage.getItem('sdr-rift-v4'));if(o&&o.up&&o.level){
    f.level=o.level;f.coins=o.coins||0;
    f.guns.bolt.power=o.up.power||0;f.guns.bolt.rate=o.up.rate||0;f.gen.sight=o.up.sight||0;f.gen.salvage=o.up.salvage||0;
  }}catch(e){}

}

function newCycle(){
  const gain=save.level-1;
  const keep={px:save.px+gain,perk:save.perk,best:Math.max(save.best,gain),cycles:save.cycles+1,auto:save.auto};
  save=Object.assign(fresh(),keep);

// ---------- audio ----------
let AC=null,NB=null,muted=false,lastTick=0;
function audioInit(){
  if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();NB=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();
}
function noise(dur,freq,vol,type){
  if(!AC||muted)return;const t=AC.currentTime,s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();
  s.buffer=NB;f.type=type||'lowpass';f.frequency.value=freq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f).connect(g).connect(AC.destination);s.start(t,Math.random()*.5);s.stop(t+dur);
}
function tone(f0,dur,vol,type,f1){
  if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(f0,t);if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+dur);o.connect(g).connect(AC.destination);o.start(t);o.stop(t+dur);
}

function ground(x){

  return G.hs[i]*(1-k)+G.hs[i+1]*k;
}
// Wren stops at HOLDX and holds the line while Sync pries the crack (at PORTAL) open
const HOLDX=PORTAL+70;
const progress=()=>clamp((G.L-G.px)/(G.L-HOLDX),0,1);
// one world px = 0.1 days of time walked back
const daysLeft=x=>Math.max(0,Math.round((x-HOLDX)/10));
const fmtDays=d=>d<365?`${d} day${d===1?'':'s'}`:`${Math.floor(d/365)} yr ${d%365} d`;
const fmtBack=d=>d<365?`−${d} d`:`−${Math.floor(d/365)} y ${d%365} d`;

function buildLevel(n){

  const hs=[];let y=480;
  for(let i=0;i<cnt;i++){y=clamp(y+(r()-.5)*90,370,540);hs.push(y)}
  const flatI=Math.ceil((PORTAL+260-x0)/S);for(let i=0;i<flatI;i++)hs[i]=hs[flatI];
  G={n,L,x0,hs,px:L,camX:L-PSX,state:'shop',time:0,es:[],bolts:[],shards:[],parts:[],pickups:[],floats:[],rings:[],ghosts:[],cores:[],
     spawnAcc:0,queue:0,qT:0,s1:false,s2:false,wAcc:.55,tears:[],warned:false,queued:false,fireT:0,aim:-.08,press:false,drag:null,recoil:0,
     shake:0,slow:0,banner:null,earned:0,kills:0,endT:0,pfade:0,dead:false,arcs:[],shield:!!save.kit.shield,inv:0,nades:[],walls:[],clocks:[],oc:0,mT:.5,mAim:0,mFlash:0,autoUsed:false,
     holding:false,hold:0,opened:false,sync:{x:L-26,y:300},spear:0,spearT:0,spearCd:0,jabs:[],dash:null,trail:[]};
  for(let x=L-650;x>PORTAL+350;x-=600+r()*350)G.cores.push({x,alive:true,bob:r()*6,pts:Array.from({length:7},()=>r()*2-1)});
  [920,1040,1160].forEach((sx,i)=>{const e=mkEnemy('drifter',G.camX+sx,'idle');e.delay=.6+i*.5;G.es.push(e)});

function mkEnemy(type,x,state){
  const t=TYPES[type];

    state,delay:0,blink:rand(2.5,5),ph:rand(1.4,2.4),phased:false,frozen:0,flash:0,P:null};
  e.fy=ground(x);e.P=pose(e);return e;
}

  const n=G.n,w=[['drifter',1],['splitter',n>=2?.3:0],['hulk',n>=3?.12+.02*n:0],['phaser',n>=4?.22:0]];
  let tot=w.reduce((a,b)=>a+b[1],0),r=Math.random()*tot;
  for(const[k,v]of w){if((r-=v)<0)return k}return 'drifter';

function frenzy(e){if(e.frenzy)return;e.frenzy=true;e.s*=1.15;e.sp*=1.2;if(e.dsp)e.dsp*=1.15;e.flash=.12}

// ---------- static layers ----------
const sky=document.createElement('canvas'),far=document.createElement('canvas'),mid=document.createElement('canvas');
function silhouettes(b,c,r,base,minH,maxH){
  let x=10;
  while(x<TW-160){
    const kind=Math.floor(r()*7),w=40+r()*110,h=minH+r()*(maxH-minH);
    b.beginPath();
    if(kind===0){b.rect(x,base-h,w*.6,h);b.rect(x+w*.28,base-h-40,3,40)}
    else if(kind===1){b.moveTo(x,base);b.lineTo(x+w*.7,base-h*.75);b.lineTo(x+w*1.4,base)}
    else if(kind===2){b.rect(x,base-h*.6,w*.5,h*.6);b.moveTo(x,base-h*.6);b.lineTo(x+w*.25,base-h*1.15);b.lineTo(x+w*.5,base-h*.6)}
    else if(kind===3){b.rect(x,base-h*.5,w,h*.5);b.moveTo(x,base-h*.5);b.arc(x+w/2,base-h*.5,w/2,Math.PI,0);b.rect(x+w/2-1.5,base-h*.5-w/2-18,3,18)}
    else if(kind===4){b.rect(x,base-h,w*.7,h);b.rect(x+w*.15,base-h-30,w*.4,30)}
    else if(kind===5){for(let i=0;i<5;i++)if(r()<.8){const ch=h*.45*(r()<.3?.6:1);b.rect(x+i*w/4,base-ch,7,ch)}b.rect(x-4,base-h*.45-8,w*.6,8)}
    else{b.rect(x,base-h*.6,12,h*.6);b.rect(x+w-12,base-h*.6,12,h*.6);b.fill();b.beginPath();b.lineWidth=12;b.strokeStyle=b.fillStyle;b.arc(x+w/2,base-h*.6,w/2-6,Math.PI,Math.PI*(1.4+r()*.4));b.stroke();b.beginPath()}
    b.fill();
    x+=w*(kind===1?1.4:1)+r()*40;
  }
  for(let i=0;i<8;i++){const y=base-r()*maxH,h=3+r()*12,dx=(r()-.5)*50;b.drawImage(c,0,y*BK,TW*BK,h*BK,dx,y,TW,h)}
}
function renderLayers(n){
  BK=Math.min(K,1.5);
  const r=mulberry(n*31+5);
  sky.width=Math.round(W*BK);sky.height=Math.round(H*BK);
  let b=sky.getContext('2d');b.setTransform(BK,0,0,BK,0,0);
  const g=b.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#120a28');g.addColorStop(.45,'#341450');g.addColorStop(.72,'#8a2f6a');g.addColorStop(.9,'#e8775e');g.addColorStop(1,'#f6a96a');
  b.fillStyle=g;b.fillRect(0,0,W,H);
  for(let i=0;i<140;i++){b.fillStyle=`rgba(255,240,255,${.2+r()*.6})`;const s=r()<.1?2:1;b.fillRect(r()*W,r()*H*.45,s,s)}
  const cx=860,cy=250,R=200;
  b.strokeStyle='rgba(255,200,230,.13)';b.lineWidth=4;b.beginPath();b.arc(cx,cy,R,0,7);b.stroke();
  b.lineWidth=1;b.beginPath();b.arc(cx,cy,R-16,0,7);b.stroke();
  for(let i=0;i<60;i++){const a=i/60*Math.PI*2,l=i%5?8:18;b.lineWidth=i%5?1.5:3;b.beginPath();b.moveTo(cx+Math.cos(a)*(R-4),cy+Math.sin(a)*(R-4));b.lineTo(cx+Math.cos(a)*(R-4-l),cy+Math.sin(a)*(R-4-l));b.stroke()}
  b.lineCap='round';b.lineWidth=7;b.beginPath();b.moveTo(cx,cy);b.lineTo(cx+Math.cos(-2.3)*110,cy+Math.sin(-2.3)*110);b.stroke();
  b.lineWidth=4;b.beginPath();b.moveTo(cx,cy);b.lineTo(cx+Math.cos(.35+n*.4)*165,cy+Math.sin(.35+n*.4)*165);b.stroke();
  b.strokeStyle='rgba(18,10,40,.55)';b.lineWidth=2.5;
  for(let k=0;k<4;k++){let a=r()*Math.PI*2,d=10;b.beginPath();b.moveTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d);while(d<R+20){d+=20+r()*25;a+=(r()-.5)*.35;b.lineTo(cx+Math.cos(a)*d,cy+Math.sin(a)*d)}b.stroke()}
  for(const[cnv,col,minH,maxH,isles]of[[far,'#3a1752',170,330,false],[mid,'#22103a',90,230,true]]){
    cnv.width=Math.round(TW*BK);cnv.height=Math.round(H*BK);
    b=cnv.getContext('2d');b.setTransform(BK,0,0,BK,0,0);b.fillStyle=col;
    silhouettes(b,cnv,r,H-(isles?120:150),minH,maxH);
    if(isles)for(let i=0;i<4;i++){
      const x=100+i*480+r()*200,y=170+r()*130,w=70+r()*90,h=50+r()*40;
      b.beginPath();b.moveTo(x,y);b.lineTo(x+w,y);b.lineTo(x+w*.8,y+h*.4);b.lineTo(x+w*.55,y+h);b.lineTo(x+w*.3,y+h*.5);b.closePath();b.fill();
      b.fillRect(x+w*.2,y-22-r()*20,10,30);b.fillRect(x+w*.6,y-14,18,14);
      b.fillStyle='rgba(94,242,255,.35)';b.fillRect(x,y-1,w,1.5);b.fillStyle=col;
    }
  }
}

// ---------- bodies ----------
function pose(e){
  if(e.type==='wraith'){
    const s=e.s,a=e.ang||0,c=Math.cos(a),sn=Math.sin(a),y=e.y||0,f=(lx,ly)=>({x:e.x+lx*c-ly*sn,y:y+lx*sn+ly*c});
    return[f(-14*s,0),{x:e.x,y,a},{x:e.x,y},f(6*s,-18*s),f(10*s,-22*s),f(4*s,14*s),f(22*s,3*s),f(0,6*s),f(0,-6*s)];
  }
  const s=e.s,th=18*s,sh=17*s,to=36*s,walk=e.state==='walk'&&!e.frozen,ph=e.phase;
  const bob=walk?Math.abs(Math.sin(ph))*2.5*s:Math.sin(ph*.8)*.8;
  const pel={x:e.x,y:e.fy-(th+sh)*.96-bob};
  const neck={x:pel.x-(walk?7:2)*s,y:pel.y-to};
  const head={x:neck.x-2*s,y:neck.y-10*s};
  const leg=(p,side)=>{
    const a=walk?Math.sin(p)*.5:.08*side;
    const knee={x:pel.x-Math.sin(a)*th,y:pel.y+Math.cos(a)*th};
    const b=a-(walk?Math.max(0,Math.cos(p))*.6:0);
    return[knee,{x:knee.x-Math.sin(b)*sh,y:knee.y+Math.cos(b)*sh}];
  };
  const[kA,fA]=leg(ph,1),[kB,fB]=leg(ph+Math.PI,-1);
  const sw=walk?Math.sin(ph*2)*2*s:0;
  return[head,neck,pel,kA,fA,kB,fB,{x:neck.x-22*s,y:neck.y+7*s+sw},{x:neck.x-19*s,y:neck.y+11*s-sw}];
}
function parts(e){
  const P=e.P,s=e.s,tw=e.type==='hulk'?14:10;
  return[[P[0],P[0],9*s,'head'],[P[1],P[2],tw*s,'body'],[P[2],P[3],5*s,'leg'],[P[3],P[4],5*s,'leg'],[P[2],P[5],5*s,'leg'],[P[5],P[6],5*s,'leg']];
}
function distSeg(x,y,a,b){
  const dx=b.x-a.x,dy=b.y-a.y,l=dx*dx+dy*dy;let t=l?((x-a.x)*dx+(y-a.y)*dy)/l:0;t=clamp(t,0,1);
  return Math.hypot(x-(a.x+dx*t),y-(a.y+dy*t));
}
function shatter(P,cols,vx,vy,n){
  for(let i=0;i<n;i++){const p=P[i%P.length];
    G.shards.push({x:p.x+rand(-4,4),y:p.y+rand(-4,4),vx:vx*rand(.2,.6)+rand(-140,140),vy:vy*rand(.2,.6)+rand(-340,-60),a:rand(0,6),va:rand(-14,14),size:rand(4,10),col:pick(cols),life:rand(1,1.9)})}
}
function kill(e,vx,vy,crit){
  e.dead=true;G.kills++;
  shatter(e.P,[e.body,e.glow,'#5ef2ff','#ff4f9a'],vx,vy,e.type==='hulk'?30:e.type==='mite'?8:18);
  const tot=Math.max(1,Math.round(e.coin*(crit?1.5:1)*salv())),pieces=Math.min(tot,6);
  for(let i=0;i<pieces;i++){const v=Math.floor(tot/pieces)+(i<tot%pieces?1:0);G.pickups.push({x:e.P[2].x,y:e.P[2].y-10,vx:rand(-120,120),vy:rand(-320,-160),v,t:0})}
  if(crit)G.floats.push({x:e.P[0].x,y:e.P[0].y-20,txt:'CRIT',t:.8,col:'#ffb347'});
  if(e.type==='splitter'){
    for(let i=0;i<2;i++){const m=mkEnemy('mite',e.x+(i?26:-14),'walk');m.frozen=e.frozen;m.flash=.15;G.es.push(m)}
    const c=e.P[2];G.rings.push({x:c.x,y:c.y-10,t:0,R:60,c:'255,79,154'});
    G.floats.push({x:c.x,y:e.P[0].y-34,txt:'SPLIT',t:.9,col:'#ff4f9a'});
  }
  sfx.shatter();
}

// ---------- combat ----------
function shoulder(){return{x:G.px+2,y:ground(G.px)-58}}
// Sync's turret floats just above him
function mountPos(){return{x:G.sync.x,y:G.sync.y-24+Math.sin(G.time*3.4)*2}}
function muzzle(){const s=shoulder(),c=Math.cos(G.aim),n=Math.sin(G.aim),l=40-G.recoil;return{x:s.x+c*l+n*3,y:s.y+n*l-c*3}}
function fire(){
  const arc=save.gun==='arc';
  G.fireT=gunStat('rate')*(G.oc>0?.5:1);G.recoil=arc?3:5;G.shake=Math.max(G.shake,1.5);
  const m=muzzle();
  if(arc){arcFire(m);return}
  G.bolts.push({x:m.x,y:m.y,vx:Math.cos(G.aim)*1400,vy:Math.sin(G.aim)*1400,life:1.1,arc:false});
  for(let i=0;i<3;i++)G.parts.push({x:m.x,y:m.y,vx:Math.cos(G.aim)*rand(60,200)+rand(-60,60),vy:Math.sin(G.aim)*rand(60,200)+rand(-60,60),life:.18,size:2.5,col:'#ffd08a'});
  sfx.shot();
}
// arc gun: instant lightning (no travelling projectile) out to ARC_RANGE, then it chains
const ARC_RANGE=560,ARC_JUMP=187,ARC_STUN=.55;
function arcFire(m){
  const dx=Math.cos(G.aim),dy=Math.sin(G.aim);let hitE=null,end=null;
  for(let d=0;d<ARC_RANGE;d+=6){
    const p={x:m.x+dx*d,y:m.y+dy*d};
    if(p.y>=ground(p.x)){end=p;break}
    const h=findHit(p);
    if(h){end=p;if(h.e)hitE=h.e;else if(h.proj)popProj(h.proj);else if(h.boss){bossHit(h.boss,gunStat('power'),p.x,p.y);G.boss.stun=.25}break}
  }
  end=end||{x:m.x+dx*ARC_RANGE,y:m.y+dy*ARC_RANGE};
  G.shake=Math.max(G.shake,RM?0:4);

function arcSpark(p){for(let i=0;i<10;i++){const a=rand(0,Math.PI*2),v=rand(60,260);G.parts.push({x:p.x,y:p.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:rand(.15,.35),size:rand(2,3.5),col:pick(['#fff2c4','#ffd08a','#ffb347'])})}}

function findHit(b){

function makeBoss(n){const hp=Math.round(1400*(1+.15*(n-1)));return{x:0,in:false,hp,max:hp,atk:3,coreT:3,open:false,flash:0,dead:false,deadT:0,stun:0,frozen:0,proj:[],carded:false,step:0}}

// body parts relative to the boss's feet; cores are the weak points
function bossGeo(){
  const b=G.boss,x=b.x,gy=ground(x),bob=Math.sin(b.step*2)*4;
  return{x,gy,body:{x:x+18,y:gy-128+bob,rx:66,ry:84},head:{x:x-38,y:gy-206+bob,r:34},
    cores:[{x:x-22,y:gy-120+bob},{x:x+16,y:gy-184+bob},{x:x+46,y:gy-74+bob}]};
}
function bossHitTest(px,py){
  const g=bossGeo();

  if(Math.hypot(px-g.head.x,py-g.head.y)<g.head.r)return'body';

function bossHit(part,dmg,x,y){

function updateBoss(dt,playing,LS){

// ---------- update ----------
function update(dt){

function seg(a,b,w,col,cap){ctx.lineCap=cap||'round';ctx.strokeStyle=col;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke()}
function figure(e,P,col){
  const s=e.s,tw=(e.type==='hulk'?20:14)*s;
  seg(P[2],P[5],5.5*s,col);seg(P[5],P[6],5.5*s,col);
  if(e.frenzy)longArm(P[1],e,col,1.2);else seg(P[1],P[8],4*s,col);
  seg(P[1],P[2],tw,col,'butt');
  seg(P[2],P[3],5.5*s,col);seg(P[3],P[4],5.5*s,col);
  if(e.frenzy)longArm(P[1],e,col,0);else seg(P[1],P[7],4.5*s,col);
  ctx.fillStyle=col;ctx.beginPath();ctx.arc(P[0].x,P[0].y,8.5*s,0,7);ctx.fill();
  if(e.frenzy){const h=P[0];ctx.beginPath();for(const d of[-1,1]){ctx.moveTo(h.x+d*3*s-2*s,h.y-6*s);ctx.lineTo(h.x+d*6*s+2*s,h.y-17*s);ctx.lineTo(h.x+d*7*s,h.y-4*s)}ctx.fill()}
}
// mutated walkers: arms stretch into long, whipping white limbs reaching for Wren
function longArm(o,e,col,seed){
  const s=e.s;let x=o.x,y=o.y+5*s,a=Math.PI+.25+seed*.15;
  ctx.lineCap='round';ctx.strokeStyle=col;
  for(let k=0;k<7;k++){
    a+=Math.sin(G.time*6+seed*2+k*.9+(e.blink||0))*.22;
    const nx=x+Math.cos(a)*8*s,ny=y+Math.sin(a)*8*s;
    ctx.lineWidth=(4.5-k*.5)*s;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(nx,ny);ctx.stroke();x=nx;y=ny;
  }
}
function drawWraith(e,P,alpha){

    ctx.save();ctx.translate(c.x+dx,c.y);ctx.rotate(a);ctx.fillStyle=col;

  const cost=def.cost[lv],v=def.vals,sp=cur==='s',have=sp?save.anchors:save.coins;
  const val=def.fmt(v[lv])+(cost!==undefined?` <em>→ ${def.short?def.short(v[lv+1]):def.fmt(v[lv+1]).split(' ')[0]}</em>`:'');
  const btn=cost===undefined?`<button class="buy ghost" type="button" disabled>Maxed</button>`
    :`<button class="buy${sp?' anc':''}" type="button" data-act="${act}" aria-label="Upgrade ${name} for ${cost} ${sp?'sparks':'anomalies'}" ${have>=cost?'':'disabled'}>${sp?ANC:CHRON}${cost}</button>`;
  return `<div class="up"><div class="ico">${ICON[key]}</div><div class="txt"><b>${name}</b><span class="val">${val}</span><div class="ticks">${v.map((_,i)=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</div></div>${btn}</div>`;
}
function kitRow(k){
  const d=KIT[k],own=save.kit[k];
  if((k==='spear'||k==='after')&&own)return upRow(k,LV[k].name,LV[k],save.lv[k],'lv:'+k,LV[k].cur);
  const cfg=k==='auto'&&own?`<div class="cfg">Use <select id="autoItem" aria-label="Consumable to deploy">${Object.entries(CONS).map(([c,v])=>`<option value="${c}"${save.auto.item===c?' selected':''}>${v.name}</option>`).join('')}</select> when <select id="autoTrig" aria-label="Trigger">${Object.entries(TRIG).map(([t,v])=>`<option value="${t}"${save.auto.trigger===t?' selected':''}>${v}</option>`).join('')}</select></div>`:'';
  return `<div class="up"><div class="ico">${ICON[k]}</div><div class="txt"><b>${d.name}</b><span class="val">${d.blurb}</span>${cfg}</div>${own?`<button class="buy ghost" type="button" disabled>Owned</button>`:`<button class="buy anc" type="button" data-act="kit:${k}" aria-label="Buy ${d.name} for ${d.cost} sparks" ${save.anchors>=d.cost?'':'disabled'}>${ANC}${d.cost}</button>`}</div>`;
}
const kitDotFor=tab=>Object.keys(KIT).some(k=>KIT[k].tab===tab&&!save.kit[k]&&save.anchors>=KIT[k].cost);
function gunStats(k){const u=GUNS[k].ups,l=save.guns[k];return `${u.power.vals[l.power]} dmg · ${u.rate.vals[l.rate].toFixed(2)} s`+(u.chain?` · ${u.chain.vals[l.chain]} jump${u.chain.vals[l.chain]>1?'s':''}`:'')}
function renderShop(){
  $('#shopT').textContent='Rift '+G.n;
  $('#shopSub').textContent=`The rift is ${fmtDays(daysLeft(G.L))} back. Clear it to earn ${G.n+1+perk('anchor')} sparks for weapons, gear and Sync.`;
  const gunDot=Object.keys(GUNS).some(k=>!save.guns[k].owned&&save.anchors>=GUNS[k].unlock);
  document.querySelectorAll('#seg button').forEach(b=>{
    const t=b.dataset.tab;b.setAttribute('aria-selected',String(t===shopTab));
    b.querySelector('.dot')?.remove();
    if((t==='gun'&&gunDot)||((t==='gear'||t==='sync')&&kitDotFor(t)))b.insertAdjacentHTML('beforeend','<span class="dot" aria-label="Something new is affordable"></span>');
  });
  let h='';
  if(shopTab==='up'){
    const g=save.gun;
    h+=`<p class="lbl">${GUNS[g].name}</p>`+Object.entries(GUNS[g].ups).map(([k,d])=>upRow(k,d.name,d,save.guns[g][k],`gun:${g}:${k}`)).join('');
    h+=`<p class="note">Sight and Anomaly Collector are in Gear. Switch weapons in Weapons.</p>`;
  }else if(shopTab==='gear'){
    h=kitRow('shield')+kitRow('spear')+upRow('dodge',LV.dodge.name,LV.dodge,save.lv.dodge,'lv:dodge',LV.dodge.cur)+kitRow('after')
      +upRow('sight',GEN.sight.name,GEN.sight,save.gen.sight,'gen:sight')
      +upRow('salvage',GEN.salvage.name,GEN.salvage,save.gen.salvage,'gen:salvage')+kitRow('boots');
  }else if(shopTab==='sync'){
    h=kitRow('mount')+kitRow('auto')+kitRow('capacitor')+kitRow('crit')+upRow('rift',LV.rift.name,LV.rift,save.lv.rift,'lv:rift',LV.rift.cur);
  }else if(shopTab==='gun'){
    h='<div class="guns">'+Object.entries(GUNS).map(([k,d])=>{
      const own=save.guns[k].owned,eq=save.gun===k;
      const btn=eq?`<button class="buy ghost" type="button" disabled>Equipped</button>`
        :own?`<button class="buy" type="button" data-act="equip:${k}">Equip</button>`
        :`<button class="buy anc" type="button" data-act="unlock:${k}" ${save.anchors>=d.unlock?'':'disabled'}>Unlock ${ANC}${d.unlock}</button>`;
      return `<div class="gcard${eq?' eq':''}">${GUNART[k](d.col)}<b>${d.name}</b><p>${d.blurb}</p><span class="stats">${own?gunStats(k):(d.start?'Starts at power and fire rate level '+d.start+', with 2 chain jumps.':'Upgrades start from zero once unlocked.')}</span>${btn}</div>`;
    }).join('')+'</div>';
  }else if(shopTab==='px'){
    const gain=save.level-1,armed=Date.now()-resetArm<4000;
    h=`<div class="reset"><div><b>Start over · +${gain} paradox</b><span>${gain?`Back to rift 1. Anomalies, sparks, upgrades, weapons, gear, Sync upgrades and consumables are wiped. Paradox perks stay. Best ever: rift ${Math.max(save.best,gain)}.`:'Clear at least one rift this cycle to earn paradox from starting over.'}</span></div><button class="buy red${armed?' armed':''}" type="button" data-act="reset" ${gain?'':'disabled'}>${armed?'Tap to confirm':'Start over'}</button></div>`;
    h+=Object.entries(PERKS).map(([k,d])=>{
      const lv=save.perk[k],cost=d.cost[lv],v=d.vals;
      const btn=cost===undefined?`<button class="buy ghost" type="button" disabled>Maxed</button>`
        :`<button class="buy red" type="button" data-act="perk:${k}" aria-label="Buy ${d.name} for ${cost} paradox" ${save.px>=cost?'':'disabled'}>${PXI}${cost}</button>`;
      return `<div class="up"><div class="ico">${ICON['p_'+k]}</div><div class="txt"><b>${d.name}</b><span class="val">${d.fmt(v[lv])}${cost!==undefined?` <em>→ ${d.short(v[lv+1])}</em>`:''}</span><div class="ticks">${v.map((_,i)=>`<i class="${i<=lv?'on':''}"></i>`).join('')}</div></div>${btn}</div>`;
    }).join('');
  }else if(shopTab==='cons'){
    h=Object.entries(CONS).map(([k,d])=>{
      const n=save.cons[k],full=n>=CONS_MAX;
      const btn=full?`<button class="buy ghost" type="button" disabled>Full</button>`
        :`<button class="buy" type="button" data-act="cons:${k}" aria-label="Buy one ${d.name} for ${d.cost} anomalies" ${save.coins>=d.cost?'':'disabled'}>${CHRON}${d.cost}</button>`;
      return `<div class="up"><div class="ico">${ICON[k]}</div><div class="txt"><b>${d.name} <span class="carry">${n}/${CONS_MAX}</span></b><span class="val">${d.blurb}</span></div>${btn}</div>`;
    }).join('')+`<p class="note">Used up when you use them. Press 1–5 or tap the buttons at the bottom of the screen during a run.</p>`;
  }
  $('#pane').innerHTML=h;
  // after 3 deaths on the same rift with nothing in the consumables bag, nudge the player toward them (once per rift)
  const tip=save.streak>=3&&Object.values(save.cons).every(n=>n===0)&&save.tipRift!==G.n&&shopTab!=='cons';
  $('#tip').hidden=!tip;$('#shop').classList.toggle('tipping',tip);
  hud();
}
$('#shop').addEventListener('change',ev=>{
  if(ev.target.id==='autoItem')save.auto.item=ev.target.value;
  else if(ev.target.id==='autoTrig')save.auto.trigger=ev.target.value;
  else return;
  persist();
});
$('#shop').addEventListener('click',ev=>{
  const t=ev.target.closest('[data-tab]');if(t){shopTab=t.dataset.tab;renderShop();return}
  const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;
  audioInit();const[a,k,s]=b.dataset.act.split(':');
  if(a==='tipgo'||a==='tipx'){save.tipRift=G.n;persist();if(a==='tipgo')shopTab='cons';renderShop();return}
  if(a==='unlock'){if(save.anchors<GUNS[k].unlock)return;save.anchors-=GUNS[k].unlock;save.guns[k].owned=true;save.gun=k;const st=GUNS[k].start||0;save.guns[k].power=Math.max(save.guns[k].power,st);save.guns[k].rate=Math.max(save.guns[k].rate,st)}
  else if(a==='equip')save.gun=k;
  else if(a==='gun'){const d=GUNS[k].ups[s],c=d.cost[save.guns[k][s]];if(c===undefined||save.coins<c)return;save.coins-=c;save.guns[k][s]++}
  else if(a==='gen'){const c=GEN[k].cost[save.gen[k]];if(c===undefined||save.coins<c)return;save.coins-=c;save.gen[k]++}
  else if(a==='kit'){if(save.anchors<KIT[k].cost)return;save.anchors-=KIT[k].cost;save.kit[k]=true;G.shield=!!save.kit.shield}
  else if(a==='lv'){const d=LV[k],c=d.cost[save.lv[k]];if(c===undefined)return;
    if(d.cur==='s'){if(save.anchors<c)return;save.anchors-=c}else{if(save.coins<c)return;save.coins-=c}
    save.lv[k]++}
  else if(a==='cons'){if(save.coins<CONS[k].cost||save.cons[k]>=CONS_MAX)return;save.coins-=CONS[k].cost;save.cons[k]++}
  else if(a==='perk'){const c=PERKS[k].cost[save.perk[k]];if(c===undefined||save.px<c)return;save.px-=c;save.perk[k]++;
    if(k==='start')save.coins+=PERKS.start.vals[save.perk[k]]-PERKS.start.vals[save.perk[k]-1];
    if(k==='seed')save.anchors+=PERKS.seed.vals[save.perk[k]]-PERKS.seed.vals[save.perk[k]-1];
    if(k==='train'){const b=save.guns.bolt,v=PERKS.train.vals[save.perk[k]];b.power=Math.max(b.power,v);b.rate=Math.max(b.rate,v)}}
  else if(a==='reset'){
    if(Date.now()-resetArm>4000){resetArm=Date.now();renderShop();setTimeout(()=>{if(G.state==='shop'&&shopTab==='px')renderShop()},4100);return}
    resetArm=0;startOver();return;
  }
  persist();sfx.buy();renderShop();
});
function enterShop(){G.state='shop';shopTab='up';$('#shop').hidden=false;$('#msg').hidden=true;$('#cbar').hidden=true;$('#dodge').hidden=true;renderShop()}
$('#go').addEventListener('click',()=>{audioInit();$('#shop').hidden=true;G.state='play';G.time=0;G.spear=save.kit.spear?lv('spear'):0;renderCbar();$('#cbar').hidden=!Object.values(save.cons).some(n=>n>0);$('#dodge').hidden=false});
function showMsg(eyebrow,title,rows,go,onGo,alt){
  $('#msgE').textContent=eyebrow;$('#msgT').textContent=title;$('#msgB').innerHTML=rows;
  const b=$('#msgGo');b.textContent=go;b.onclick=onGo;
  $('#msgAlt').hidden=!alt;$('#msg').hidden=false;$('#cbar').hidden=true;$('#dodge').hidden=true;b.focus({preventScroll:true});
}
function showClear(){
  G.state='over';
  const anc=G.n+1+perk('anchor');
  save.anchors+=anc;save.level=G.n+1;save.best=Math.max(save.best,G.n);save.streak=0;
  if(G.boss){
    // end of a chapter: Sync pulls an anchor out of the wreckage. (Sol's scene will hang off this.)
    const ch=G.n/5,first=(save.storyAnchors||0)<ch;if(first)save.storyAnchors=ch;persist();
    showMsg(`Chapter ${ch} complete`,first?'An anchor':'Through the rift',
      `<div>Echoes shattered<b>${G.kills}</b></div><div>Anomalies collected<b>+${G.earned}</b></div><div class="ancrow">Sparks earned<b>+${anc}</b></div>`+
      (first?`<p>As the Hollow Hour comes apart, Sync pulls something out of the wreckage: an anchor, the first thing in the Unbound that feels solid. It hums when Wren holds it.</p>`:`<p>You already carry this chapter's anchor.</p>`),
      'Next rift',()=>{buildLevel(save.level);enterShop()},false);
    return;
  }
  persist();
  showMsg(`Rift ${G.n} reached`,'Through the rift',
    `<div>Echoes shattered<b>${G.kills}</b></div><div>Anomalies collected<b>+${G.earned}</b></div><div class="ancrow">Sparks earned<b>+${anc}</b></div><p>Spend sparks on weapons, gear and Sync upgrades in the loadout.</p>`,
    'Next rift',()=>{buildLevel(save.level);enterShop()},false);
}
function showDead(){
  G.state='over';
  save.streak=(save.streak||0)+1;
  const pct=Math.round(progress()*100),dist=Math.round(progress()*(20+8*(G.n-1))*salv());
  save.coins+=dist;persist();
  showMsg(`Rift ${G.n} · ${pct}% of the way`,'Erased',
    `<div>Anomalies collected<b>+${G.earned}</b></div><div>Distance bonus (${pct}%)<b>+${dist}</b></div><p>An echo caught you ${fmtDays(daysLeft(G.px))} short of the rift. Everything you earned is yours to keep.</p>`,
    'Again',()=>{buildLevel(G.n);enterShop()},false);
}
function startOver(){
  const gain=newCycle();
  buildLevel(1);G.state='over';$('#shop').hidden=true;
  showMsg(`Cycle ${save.cycles+1}`,'Timeline reset',
    `<div class="pxrow">Paradox earned<b>+${gain}</b></div><div>Best ever<b>Rift ${save.best}</b></div><p>You're back at rift 1. Spend paradox in the Paradox tab before you set out.</p>`,
    'To the loadout',()=>{enterShop();shopTab='px';renderShop()},false);
}
$('#mute').addEventListener('click',()=>{muted=!muted;$('#mute').textContent=muted?'Sound off':'Sound on'});

// ---------- input ----------
function toLocal(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width*W+G.camX,y:(e.clientY-r.top)/r.height*H}}
function aimAt(pt){const s=shoulder();G.aim=clamp(Math.atan2(pt.y-s.y,Math.max(8,pt.x-s.x)),-1.3,1)}
cv.addEventListener('pointerdown',e=>{
  audioInit();inputMode=e.pointerType==='mouse'?'mouse':'touch';
  if(G.state!=='play')return;
  e.preventDefault();try{cv.setPointerCapture(e.pointerId)}catch(_){}
  G.press=true;const pt=toLocal(e);
  if(inputMode==='mouse')aimAt(pt);else G.drag={y:pt.y,aim:G.aim};
});
cv.addEventListener('pointermove',e=>{
  if(e.pointerType==='mouse'){inputMode='mouse';aimAt(toLocal(e))}
  else if(G.press&&G.drag){const pt=toLocal(e);G.aim=clamp(G.drag.aim+(pt.y-G.drag.y)*.006,-1.3,1)}
});
const release=()=>{G.press=false;G.drag=null};
cv.addEventListener('pointerup',release);cv.addEventListener('pointercancel',release);
document.addEventListener('pointerdown',audioInit);

// ---------- sizing + loop ----------
function fit(){
  const r=wrap.getBoundingClientRect(),s=Math.min(r.width/W,r.height/H)||1;
  stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  const k=clamp(s*(window.devicePixelRatio||1),.5,2.5);
  if(Math.abs(k-K)>.05||cv.width!==Math.round(W*k)){K=k;cv.width=Math.round(W*K);cv.height=Math.round(H*K);if(G)renderLayers(G.n)}
}
let rz=0;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(fit,80)});
fit();
buildLevel(save.level);
enterShop();
let lastT=performance.now(),acc=0;
function frame(now){
  const rdt=Math.min(.05,(now-lastT)/1000);lastT=now;
  const ts=G.slow>0?.3:1;G.slow=Math.max(0,G.slow-rdt);
  acc+=rdt*ts;let n=0;
  while(acc>=DT&&n<5){update(DT);acc-=DT;n++}
  if(n===5)acc=0;
  render();hud();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
